
  # 2. build the Docker image and push it to GitHub Container Registry (main only)
  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/modelflow" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. pull the new image on EC2 and restart the container
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/modelflow" >> "$GITHUB_ENV"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy the production compose file
        run: scp -i ~/.ssh/ec2.pem compose.prod.yaml "ubuntu@${{ secrets.EC2_HOST }}:~/modelflow/compose.yaml"

      - name: Pull the new image and restart
        run: |
          ssh -i ~/.ssh/ec2.pem "ubuntu@${{ secrets.EC2_HOST }}" bash -s <<EOF
            set -e
            cd ~/modelflow
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export IMAGE="${IMAGE}" IMAGE_TAG="${{ github.sha }}"
            docker compose pull
            docker compose up -d
            docker logout ghcr.io
            docker image prune -f
          EOF

      - name: Check the app is healthy
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}/health"; then exit 0; fi
            sleep 5
          done
          echo "App did not become healthy" && exit 1